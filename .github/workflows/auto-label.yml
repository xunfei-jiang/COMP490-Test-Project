name: Auto Label PRs
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: bryan-aguilar/conventional-pr-labeler@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
